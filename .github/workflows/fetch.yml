name: Fetch media
on:
  push:
    branches: [fetch-photos]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null || true
          pip install -q numpy pillow
          mkdir -p media
          for spec in "31387434 lagoon 250 440 0 480" "30344687 palm 0 560 300 480"; do
            set -- $spec
            curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.pexels.com/download/video/$1/" -o /tmp/$1.mp4
            python3 stab.py /tmp/$1.mp4 media/$2.mp4 $3 $4 $5 $6 > media/$2.txt 2>&1 || cat media/$2.txt
            ffprobe -v error -show_entries stream=width,height,bit_rate:format=duration,size -of default=nw=1 media/$2.mp4 >> media/$2.txt
            ffmpeg -v error -y -i media/$2.mp4 -frames:v 1 -q:v 2 media/$2_poster.jpg
            for t in 0 3 5; do ffmpeg -v error -y -ss $t -i media/$2.mp4 -frames:v 1 -vf scale=270:-2 media/$2_f$t.jpg; done
            ffmpeg -v error -y -ss 1 -i media/$2.mp4 -frames:v 1 -vf "crop=600:600:400:1100" media/$2_crop.png
          done
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add media; git commit -m "1080p loops" && git push
