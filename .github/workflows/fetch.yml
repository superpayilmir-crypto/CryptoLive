name: Fetch media
on:
  push:
    branches: [fetch-photos]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null || true
          mkdir -p media
          for id in 5636114 31387434 29593270 5278926 10452100 30022430 27017491 4627340 35537277 30344687 27696896 12332218 39200736 35102233 3371612 4942034 26651655 35972707 16453402 8187626; do
            curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.pexels.com/download/video/$id/" -o /tmp/v.mp4 || continue
            info=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate:format=duration -of csv=p=0 /tmp/v.mp4 | tr '\n' ' ')
            echo "$id $(stat -c %s /tmp/v.mp4) $info" >> media/info.txt
            for t in 1 5; do ffmpeg -v error -ss $t -i /tmp/v.mp4 -frames:v 1 -vf "scale=240:-2" media/${id}_$t.jpg || true; done
            rm -f /tmp/v.mp4
          done
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add media; git commit -m "4k candidates" && git push
