name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk CryptoLive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoLive-apk
          path: CryptoLive.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Crypto Live ${{ github.run_number }}
          body: "Скачайте CryptoLive.apk ниже и установите на Android."
          files: CryptoLive.apk
          make_latest: true
