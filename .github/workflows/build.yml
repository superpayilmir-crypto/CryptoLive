name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/pages.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decrypt signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Добавьте секрет SIGNING_PASSWORD: Settings → Secrets and variables → Actions"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/release.keystore.enc \
            -out "$RUNNER_TEMP/release.keystore" -pass env:SIGNING_PASSWORD
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk CryptoLive.apk
      - name: Verify APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -c -p 4 CryptoLive.apk
          $BT/apksigner verify --verbose --print-certs CryptoLive.apk | tee verify.txt
          $BT/aapt2 dump badging CryptoLive.apk | head -3 | tee -a verify.txt
          echo "SIG=$(grep -m1 'SHA-256' verify.txt | awk '{print $NF}')" >> $GITHUB_ENV
          echo "VER=$(grep -o "versionCode='[0-9]*'" verify.txt | head -1)" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoLive-apk
          path: CryptoLive.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Crypto Live ${{ github.run_number }}
          body: "Скачайте CryptoLive.apk ниже и установите на Android. Проверено: подпись в порядке. ${{ env.VER }} · ключ ${{ env.SIG }}"
          files: CryptoLive.apk
          make_latest: true
